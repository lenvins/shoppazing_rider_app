name: shoppazing_rider_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  http: ^1.4.0
  shared_preferences: ^2.2.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.1

  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  firebase_database: ^12.1.3
  firebase_messaging: ^16.1.1
  firebase_storage: ^13.0.6
  flutter_local_notifications: ^20.1.0
  intl: ^0.20.2
  sqflite: ^2.4.2
  path: ^1.9.1
  qr_flutter: ^4.1.0
  pin_code_fields: ^9.1.0
  webview_flutter: ^4.4.2
  connectivity_plus: ^7.0.0
  image_picker: ^1.0.7
  barcode_widget: ^2.0.4
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.1.2
  url_launcher: ^6.2.4
  in_app_update: ^4.2.5
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/

flutter_native_splash:
  color: "#004e99"
  color_dark: "#004e99"
  image: assets/shoppazing_logo.jpg
  image_dark: assets/shoppazing_logo.jpg

  android_12:
    color: "#004e99"
    color_dark: "#004e99"
    image: assets/shoppazing_logo.jpg
    image_dark: assets/shoppazing_logo.jpg

  android_gravity: center
  ios_content_mode: center
  android: true
  ios: true
  web: false

flutter_icons:
  android: true
  ios: true
  image_path: "assets/shoppazing_logo.jpg"
